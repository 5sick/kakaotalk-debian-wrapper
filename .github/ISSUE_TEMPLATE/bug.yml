name: 문제 보고
description: 설치, 실행, 한글 입력, 파일 창 등이 제대로 동작하지 않을 때
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
      description: 무엇을 했을 때 어떻게 됐는지, 원래 어떻게 되어야 하는지 적어 주세요. 스크린샷도 좋습니다.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: kakaotalk --report 출력
      description: 터미널에서 `kakaotalk --report`를 실행하고 출력을 그대로 붙여넣어 주세요. 홈 폴더 경로와 사용자 이름은 가려서 나옵니다.
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: 카카오톡 버전
      options:
        - 기본 설치 (공식 64비트)
        - 새 Qt 버전 (베타)
        - 모름
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 로그 (있으면)
      description: |
        `kakaotalk --config`에서 `KAKAOTALK_DEBUG=1`을 켜고 문제를 다시 겪은 뒤,
        `~/.cache/kakaotalk-debian-wrapper/`의 최신 `wine-*.log` 끝부분이나 파일을 첨부해 주세요.
      render: text
